name: 💡 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎分享你的想法！请说明具体场景和想要解决的问题，而不只是想要什么功能。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: "你是谁、在什么情况下需要这个功能？"
      placeholder: "作为一个同时运营 3 个网站的运营人员，我希望……"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的功能 / 行为
      placeholder: "希望在采集数据产生时（如工单、需求或线索），自动向飞书/钉钉群推送一条通知"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      placeholder: "目前只能每天手动登录后台导出采集数据 CSV"

  - type: dropdown
    id: module
    attributes:
      label: 相关模块
      options:
        - 聊天挂件
        - 管理后台
        - 知识库 / RAG
        - 数据采集 / 业务字段
        - LLM / 模型接入
        - 部署 / Docker
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索过现有 Issue，没有重复建议
          required: true
